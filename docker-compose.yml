version: '3.8'

services:
  # PostgreSQL для multi-tenant системы
  postgres:
    image: postgres:15-alpine
    container_name: xx-autojobs-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoapplyer}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_MAX_CONNECTIONS: 200
      POSTGRES_SHARED_BUFFERS: 256MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./alembic:/alembic:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-autoapplyer}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - xx-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis для FIFO очередей
  redis:
    image: redis:7-alpine
    container_name: xx-autojobs-redis
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - xx-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Minimal API для мониторинга
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: xx-autojobs-api
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL_DOCKER}
      - REDIS_URL=${REDIS_URL_DOCKER}
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
      - "${METRICS_PORT:-9090}:9090"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - xx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Worker с Playwright - instance 1
  worker-1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: xx-autojobs-worker-1
    env_file: .env
    environment:
      - WORKER_ID=worker-1
      - DATABASE_URL=${DATABASE_URL_DOCKER}
      - REDIS_URL=${REDIS_URL_DOCKER}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - BROWSER_POOL_SIZE=${BROWSER_POOL_SIZE:-5}
      - BROWSER_HEADLESS=${BROWSER_HEADLESS:-true}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gemini-1.5-flash}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - xx-network
    restart: unless-stopped
    # Для headless mode нужен shared memory
    shm_size: '2gb'
    # Ограничения ресурсов
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    volumes:
      - ./logs/worker-1:/app/logs
      - browser-profiles:/app/browser-profiles
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # Worker с Playwright - instance 2
  worker-2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: xx-autojobs-worker-2
    env_file: .env
    environment:
      - WORKER_ID=worker-2
      - DATABASE_URL=${DATABASE_URL_DOCKER}
      - REDIS_URL=${REDIS_URL_DOCKER}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - BROWSER_POOL_SIZE=${BROWSER_POOL_SIZE:-5}
      - BROWSER_HEADLESS=${BROWSER_HEADLESS:-true}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gemini-1.5-flash}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - xx-network
    restart: unless-stopped
    shm_size: '2gb'
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    volumes:
      - ./logs/worker-2:/app/logs
      - browser-profiles:/app/browser-profiles
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # Nginx reverse proxy (опционально)
  nginx:
    image: nginx:alpine
    container_name: xx-autojobs-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - api
    networks:
      - xx-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Grafana для мониторинга (опционально)
  grafana:
    image: grafana/grafana:latest
    container_name: xx-autojobs-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - xx-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Prometheus для сбора метрик (опционально)
  prometheus:
    image: prom/prometheus:latest
    container_name: xx-autojobs-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - xx-network
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  browser-profiles:
    driver: local
  nginx-cache:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local

networks:
  xx-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16